    <style>
      html, body { overflow-x: hidden; }
      /* Cone stays visible on mobile but scaled down + contained. cone-wrap's
         own transform is NOT touched by the cone JS (which only writes to
         cone-tilt / cone-spin), so scaling it here is safe. */
      @media (max-width: 1023px) {
        .cone-wrap { transform: scale(0.46); transform-origin: center center; height: 360px !important; overflow: hidden !important; }
      }
      /* The demo nav is `hidden md:flex` — show it on phones so the links appear. */
      @media (max-width: 767px) {
        header > nav { display: flex !important; gap: 9px !important; flex-shrink: 0; }
        header > nav .bracket-link { font-size: 9px !important; letter-spacing: 0.5px !important; }
        header > a:first-child { font-size: 10px !important; letter-spacing: 0.5px !important; white-space: nowrap !important; }
        /* Hero name clamp-floor (42px) too wide for phones — shrink + allow wrap. */
        #projects h1 { font-size: clamp(28px, 8vw, 44px) !important; overflow-wrap: anywhere; word-break: break-word; max-width: 100%; }
      }
    </style>
